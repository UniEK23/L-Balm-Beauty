<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — L'Balm Beauty</title>
<link rel="stylesheet" href="../css/login.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body data-page="auth">
<div class="auth-card">
  <div class="auth-visual"><img src="../assets/images/product-placeholder.jpg" alt="L'Balm Beauty products"><p>Beauty that glows beyond the mirror.</p></div>
  <div class="auth-panel">
    <a class="back" href="lbalm.html">← Back to store</a>
    <h1>Login</h1><p class="welcome-msg">Welcome back!</p>
    <form data-auth="login">
      <div class="form-group"><label for="email">Email Address</label><input type="email" id="email" name="email" autocomplete="email" required></div>
      <div class="form-group"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required></div>
      <a href="contact.html" class="password-reset">Forgot password?</a>
      <button type="submit">Login</button>
      <p class="auth-msg" hidden role="status"></p>
      <p class="signup-link">Don't have an account? <a href="register.html">Register</a></p>
    </form>
  </div>
</div>
<script src="../js/products.js"></script><script src="../js/pages.js"></script>
</body>
</html>
