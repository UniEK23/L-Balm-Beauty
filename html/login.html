<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <link rel="stylesheet" href="../css/login.css">

        <!-- Google Fonts -->
        <!-- Playfair Display -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

        <!-- Poppins -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    </head>
    <body>
        <div class="container">

            <div class="image-container">
                <img src="../assets/images/LoginImg.png" alt="Login Image" class="login-image">
            </div>

            <div class="login-container">
                <h1>Login</h1>
                <p class="welcome-msg">Welcome back!</p>

                <form>
                    <div class="form-group">
                        <label for="username">Email Address</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <a href="" class="password-reset">Forgot password?</a>

                    <button type="submit">LOGIN</button>

                    <p class="signup-link">Don't have an account? <a href="register.html">Register</a></p>
                </form>
            </div>

        </div>
    </body>
</html>
