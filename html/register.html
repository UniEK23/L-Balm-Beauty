<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — L'Balm Beauty</title>
<link rel="stylesheet" href="../css/register.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body data-page="auth">
<div class="auth-card">
  <div class="auth-visual"><img src="../assets/images/product-placeholder.jpg" alt="L'Balm Beauty products"><p>Join the glow community.</p></div>
  <div class="auth-panel">
    <a class="back" href="lbalm.html">← Back to store</a>
    <h1>Register</h1><p class="welcome-msg">Join the L'Balm Community</p>
    <form data-auth="register">
      <div class="form-group"><label for="name">Full Name</label><input type="text" id="name" name="name" placeholder="Enter your full name" autocomplete="name" required></div>
      <div class="form-group"><label for="email">Email Address</label><input type="email" id="email" name="email" placeholder="Enter your email address" autocomplete="email" required></div>
      <div class="form-group"><label for="password">Password</label><input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" required></div>
      <button type="submit">Register</button>
      <p class="auth-msg" hidden role="status"></p>
      <p class="login-link">Already have an account? <a href="login.html">Login</a></p>
    </form>
  </div>
</div>
<script src="../js/products.js"></script><script src="../js/pages.js"></script>
</body>
</html>
